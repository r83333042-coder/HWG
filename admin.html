<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>HWG - Super Admin Master Dashboard</title>
    <style>
        :root { --blue: #007bff; --red: #dc3545; --green: #28a745; --dark: #343a40; --light: #f8f9fa; --glass: rgba(255, 255, 255, 0.9); }
        body { font-family: 'Inter', sans-serif; background: #e9ecef; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1300px; margin: auto; }
        
        /* Glassmorphism Header */
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--dark); color: white; padding: 20px 30px; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 4px solid var(--blue); transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h4 { margin: 0; font-size: 14px; color: #6c757d; text-transform: uppercase; }
        .stat-card h2 { margin: 10px 0 0 0; font-size: 24px; color: var(--dark); }

        /* Main Dashboard Layout */
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        /* Search & Table */
        .search-container { position: relative; margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 15px 20px; border: 2px solid #dee2e6; border-radius: 12px; font-size: 16px; transition: 0.3s; box-sizing: border-box; }
        .search-bar:focus { border-color: var(--blue); outline: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid #dee2e6; color: #495057; font-weight: 600; }
        td { padding: 15px; border-bottom: 1px solid #eee; }

        /* Proof Cards */
        .proof-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .proof-card { background: var(--light); border-radius: 15px; padding: 15px; display: flex; gap: 15px; align-items: center; border: 1px solid #ddd; }
        .proof-img { width: 80px; height: 110px; object-fit: cover; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .proof-img:hover { opacity: 0.8; }

        /* Modal */
        #imgModal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        #modalImg { max-width: 90%; max-height: 85%; margin: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 10px; }
        .close { position: absolute; top: 30px; right: 40px; color: white; font-size: 40px; cursor: pointer; }

        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 13px; }
        .btn-primary { background: var(--blue); color: white; }
        .btn-success { background: var(--green); color: white; }
        .btn-danger { background: var(--red); color: white; }
        .btn:active { transform: scale(0.95); }

        .spin-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="imgModal">
    <span class="close" onclick="closeImg()">&times;</span>
    <img id="modalImg">
</div>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">HWG Super Admin ⚡</h1>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" onclick="window.location.href='tasks.html'">🛠️ Manage Tasks</button>
            <button class="btn btn-primary" style="background:#ff9800;" onclick="window.location.href='spindata.html'">🎰 Spin Panel</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h4>Total Users</h4><h2 id="st-users">0</h2></div>
        <div class="stat-card" style="border-top-color: orange;"><h4>Top Ranker</h4><h2 id="st-top" style="font-size:18px;">Loading...</h2></div>
        <div class="stat-card" style="border-top-color: var(--green);"><h4>Pending Proofs</h4><h2 id="st-proofs">0</h2></div>
        <div class="stat-card" style="border-top-color: var(--red);"><h4>Today's Activity</h4><h2 id="st-act">0</h2></div>
    </div>

    <div class="main-grid">
        <div class="card">
            <h3>👥 User Database</h3>
            <div class="search-container">
                <input type="text" id="uSearch" class="search-bar" placeholder="Username ya referral code search karein..." onkeyup="renderAll()">
            </div>
            <div style="max-height: 500px; overflow-y: auto;">
                <table>
                    <thead><tr><th>User</th><th>PIN</th><th>Points</th><th>Action</th></tr></thead>
                    <tbody id="u-table"></tbody>
                </table>
            </div>

            <hr style="margin:30px 0; border:0; border-top:1px solid #eee;">
            
            <h3>📸 Verification Hall</h3>
            <div id="v-hall" class="proof-grid"></div>
        </div>

        <div class="card" style="background: var(--light);">
            <h3 style="margin-top:0;">🎰 Spin History (Live)</h3>
            <div id="spin-history" style="max-height: 300px; overflow-y: auto;"></div>
            
            <h3 style="margin-top:30px;">📝 Points Log</h3>
            <div id="points-log" style="font-size:12px; color:#555;"></div>
        </div>
    </div>
</div>

<script>
    // 🔥 CONFIGURATION
    const SHEET_API_URL = "";

    // Background sync function
    async function syncToSheet(tableName, dataArray) {
        fetch(SHEET_API_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                table: tableName,
                action: "add_row",
                rowData: dataArray
            })
        });
    }

    // Yeh function database ko Local aur Sheet dono se sync rakhega
    function getDB() { return JSON.parse(localStorage.getItem('hwg_db')) || []; }

    function renderAll() {
        let db = getDB();
        let search = document.getElementById('uSearch').value.toLowerCase();
        
        // Stats
        document.getElementById('st-users').innerText = db.length;
        let sorted = [...db].sort((a,b) => b.points - a.points);
        if(sorted[0]) document.getElementById('st-top').innerText = `@${sorted[0].username} (${sorted[0].points})`;

        // User Table (Same as original)
        let uHtml = "";
        db.forEach((u, i) => {
            if(u.username.includes(search) || (u.myCode && u.myCode.includes(search.toUpperCase()))) {
                uHtml += `<tr>
                    <td><b>@${u.username}</b><br><small style="color:var(--blue)">${u.myCode}</small></td>
                    <td><input type="text" id="pin-${i}" value="${u.pin}" style="width:50px; padding:5px; border-radius:5px; border:1px solid #ddd;"></td>
                    <td><input type="number" id="pts-${i}" value="${u.points}" style="width:60px; padding:5px; border-radius:5px; border:1px solid #ddd;"></td>
                    <td>
                        <button class="btn btn-primary" onclick="saveU(${i})" style="padding:5px 10px;">Save</button>
                        <button class="btn btn-danger" onclick="delU(${i})" style="padding:5px 10px;">X</button>
                    </td>
                </tr>`;
            }
        });
        document.getElementById('u-table').innerHTML = uHtml;

        // Verification Hall (Same as original)
        let pHtml = ""; let pCount = 0;
        db.forEach((u, uIdx) => {
            (u.proofs || []).forEach((p, pIdx) => {
                if(p.status === 'pending') {
                    pCount++;
                    pHtml += `<div class="proof-card">
                        <img src="${p.img}" class="proof-img" onclick="openImg('${p.img}')">
                        <div>
                            <small>@${u.username}</small><br>
                            <b style="font-size:12px;">${p.taskId}</b><br>
                            <button class="btn btn-success" style="padding:4px 8px; margin-top:5px;" onclick="verify(${uIdx},${pIdx},'yes',${p.points})">✓</button>
                            <button class="btn btn-danger" style="padding:4px 8px; margin-top:5px;" onclick="verify(${uIdx},${pIdx},'no')">✕</button>
                        </div>
                    </div>`;
                }
            });
        });
        document.getElementById('v-hall').innerHTML = pHtml || "No pending proofs.";
        document.getElementById('st-proofs').innerText = pCount;

        loadSpinHistory();
    }

    function openImg(src) { document.getElementById('modalImg').src = src; document.getElementById('imgModal').style.display = 'block'; }
    function closeImg() { document.getElementById('imgModal').style.display = 'none'; }

    // Updated Verify to sync with logs
    function verify(uIdx, pIdx, choice, pts) {
        let db = getDB();
        if(choice === 'yes') {
            db[uIdx].points = parseFloat((db[uIdx].points + pts).toFixed(2));
            db[uIdx].proofs[pIdx].status = 'approved';
            
            let logMsg = `@${db[uIdx].username} got +${pts} pts`;
            let hist = JSON.parse(localStorage.getItem('hwg_history')) || [];
            hist.unshift(`${new Date().toLocaleTimeString()}: ${logMsg}`);
            localStorage.setItem('hwg_history', JSON.stringify(hist.slice(0,10)));
        } else {
            db[uIdx].proofs.splice(pIdx, 1);
        }
        localStorage.setItem('hwg_db', JSON.stringify(db)); 
        renderAll();
    }

    function saveU(i) {
        let db = getDB();
        db[i].pin = document.getElementById(`pin-${i}`).value;
        db[i].points = parseFloat(document.getElementById(`pts-${i}`).value);
        localStorage.setItem('hwg_db', JSON.stringify(db)); 
        renderAll(); 
        alert("Updated!");
    }

    function delU(i) { if(confirm("Delete user?")) { let db = getDB(); db.splice(i,1); localStorage.setItem('hwg_db', JSON.stringify(db)); renderAll(); } }

    function loadSpinHistory() {
        let sHist = JSON.parse(localStorage.getItem('spin_history')) || [];
        document.getElementById('spin-history').innerHTML = sHist.slice(-10).reverse().map(s => `<div class="spin-item"><span>@${s.user}</span> <b style="color:var(--green)">+${s.prize}</b></div>`).join('');
        
        let pLog = JSON.parse(localStorage.getItem('hwg_history')) || [];
        document.getElementById('points-log').innerHTML = pLog.map(l => `<div>• ${l}</div>`).join('');
    }

    window.onload = renderAll;
</script>

</body>
</html>
